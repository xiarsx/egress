<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>egress 管理后台</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">egress</div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">概览</button>
    <button class="tab" data-tab="nodes">节点</button>
    <button class="tab" data-tab="sources">来源</button>
    <button class="tab" data-tab="leases">租约</button>
    <button class="tab" data-tab="logs">日志</button>
  </nav>
  <div class="tokenbox">
    <input id="token" type="password" placeholder="AdminToken" autocomplete="off" spellcheck="false">
    <button id="tokenSave">保存</button>
  </div>
</header>

<main id="main">
  <section class="page active" id="page-overview">
    <div class="row" id="ovCards"></div>
    <h2>平台</h2>
    <div class="row" id="ovPlatforms"></div>
    <h2>指标快照 <span class="hint">（原始 JSON，结构待前端细化）</span></h2>
    <div id="ovMetrics"></div>
  </section>

  <section class="page" id="page-nodes">
    <div class="toolbar">
      <label>平台 <select id="nodePlatform"><option value="">全部</option></select></label>
      <label>健康 <select id="nodeHealth">
        <option value="">全部</option>
        <option value="probing">probing</option>
        <option value="healthy">healthy</option>
        <option value="tripped">tripped</option>
      </select></label>
      <button id="nodeReload">刷新</button>
    </div>
    <div id="nodeTable"></div>
    <div class="pager" id="nodePager"></div>
  </section>

  <section class="page" id="page-sources">
    <div class="toolbar"><button id="sourceReload">刷新列表</button></div>
    <div id="sourceTable"></div>
  </section>

  <section class="page" id="page-leases">
    <div class="toolbar">
      <label>平台 <select id="leasePlatform"></select></label>
      <button id="leaseReload">刷新</button>
    </div>
    <div id="leaseTable"></div>
    <div class="pager" id="leasePager"></div>
  </section>

  <section class="page" id="page-logs">
    <div class="toolbar">
      <label>平台 <input id="logPlatform" placeholder="platform"></label>
      <label>账号 <input id="logAccount" placeholder="account"></label>
      <label>错误码 <input id="logError" placeholder="resin_error"></label>
      <button id="logSearch">查询</button>
    </div>
    <div id="logTable"></div>
    <div class="pager" id="logPager"></div>
    <div id="logDetail"></div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="./app.js"></script>
</body>
</html>
